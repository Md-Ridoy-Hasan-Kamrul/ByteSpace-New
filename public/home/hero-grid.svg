<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" fill="none" shape-rendering="crispEdges">
  <!-- Figma "Group 4": 2px white strokes at 12% opacity. Vertical lines fill [x, x+2), horizontal lines fill [y-2, y).
       Line 13 (x=1440) and Line 26 (y=0) sit outside the frame; the tile repeats horizontally, so Line 1 of the next tile stands in for Line 13. -->
  <g id="Group 4" fill="white" opacity="0.12">
    <rect id="Line 1" x="0" y="0" width="2" height="1024" />
    <rect id="Line 2" x="120" y="0" width="2" height="1024" />
    <rect id="Line 3" x="240" y="0" width="2" height="1024" />
    <rect id="Line 4" x="360" y="0" width="2" height="1024" />
    <rect id="Line 5" x="480" y="0" width="2" height="1024" />
    <rect id="Line 6" x="600" y="0" width="2" height="1024" />
    <rect id="Line 7" x="720" y="0" width="2" height="1024" />
    <rect id="Line 8" x="840" y="0" width="2" height="1024" />
    <rect id="Line 9" x="960" y="0" width="2" height="1024" />
    <rect id="Line 10" x="1080" y="0" width="2" height="1024" />
    <rect id="Line 11" x="1200" y="0" width="2" height="1024" />
    <rect id="Line 12" x="1320" y="0" width="2" height="1024" />
    <path d="M0 958h1440v2H0zM0 838h1440v2H0zM0 718h1440v2H0zM0 604h1440v2H0zM0 478h1440v2H0zM0 358h1440v2H0zM0 238h1440v2H0zM0 118h1440v2H0z" />
